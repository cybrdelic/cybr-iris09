name: Native IRIS rendering
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux software OpenGL runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri
          echo 'EGL_PLATFORM=surfaceless' >> "$GITHUB_ENV"
          echo 'LIBGL_ALWAYS_SOFTWARE=1' >> "$GITHUB_ENV"
      - name: Install pinned native dependencies
        run: python -m pip install -r requirements-native.txt
      - name: Check native source and supervisor contracts
        run: |
          python -m unittest discover -s tests -p test_native_generator.py -v
          python -m unittest discover -s tests -p test_native_validator.py -v
          python -m unittest discover -s tests -p test_native_preview.py -v
      - name: Render all four camera samples at three wavelengths
        run: python tools/render_native.py --width 128 --height 72 --samples 2 --timeout 60 --output test-results/native/aa2.png --json test-results/native/aa2.json
      - name: Render explicit AA1 at an odd resolution and changed camera
        run: python tools/render_native.py --width 159 --height 91 --samples 1 --time 5 --drag -20 9 --scroll -1 --timeout 60 --output test-results/native/aa1.png --json test-results/native/aa1.json
      - name: Compare against independent original shader probes
        run: python tools/validate_native.py --json test-results/native/comparison.json
      - name: Verify real localhost native frames and clean shutdown
        timeout-minutes: 3
        run: python tests/native_preview_smoke.py --timeout 60 --out test-results/native/http-preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}
          path: test-results/native/
